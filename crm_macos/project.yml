# Demo CRM для macOS — описание проекта для xcodegen.
# `xcodegen generate` пересобирает DemoCRM.xcodeproj; сам .xcodeproj тоже
# лежит в репозитории, поэтому xcodebuild работает и без xcodegen.
name: DemoCRM
options:
  bundleIdPrefix: md.una.contragenti
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
targets:
  Demo CRM:
    type: application
    platform: macOS
    sources:
      - path: Sources/DemoCRM
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: Demo CRM
        CFBundleDisplayName: Demo CRM
        CFBundleIdentifier: md.una.contragenti.democrm
        CFBundleShortVersionString: "1.3.7"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.business
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Contragenti · date.gov.md"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Demo CRM
        PRODUCT_BUNDLE_IDENTIFIER: md.una.contragenti.democrm
        MARKETING_VERSION: "1.3.7"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: false
        # подписи Apple Developer ID нет — ad-hoc, как и на Windows без code-signing
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_APP_SANDBOX: false
        SWIFT_STRICT_CONCURRENCY: minimal
        COMBINE_HIDPI_IMAGES: true
        DEAD_CODE_STRIPPING: true
schemes:
  Demo CRM:
    build:
      targets:
        Demo CRM: all
    run:
      config: Debug
    archive:
      config: Release
